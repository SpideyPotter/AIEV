# CPU-only pod for dataloader / unit checks while a training Job holds the
# MIG slice. Sized to fit next to job_train_scratch.yaml within the
# 16 CPU / 32Gi quota.
#
# Apply:   kubectl apply -f k8s/pod_cpu.yaml
# Exec:    kubectl exec -it idd-panoptic-cpu -- bash
# Delete:  kubectl delete pod idd-panoptic-cpu

apiVersion: v1
kind: Pod
metadata:
  name: idd-panoptic-cpu
  labels:
    app: idd-panoptic-cpu
    app.kubernetes.io/name: local-storage
spec:
  restartPolicy: Never
  containers:
    - name: pytorch
      image: bmu-headnode:9443/nvcr.io/nvidia/pytorch:24.10-py3
      command: ["/bin/bash", "-c", "while true; do sleep 3600; done"]
      workingDir: /workspace
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONPATH
          value: "/workspace:/workspace/external/Mask2Former:/workspace/.local/lib/python3.10/site-packages:/workspace/.local/local/lib/python3.10/dist-packages:/workspace/.local/lib/python3.10/dist-packages"
        - name: PATH
          value: "/workspace/.local/bin:/workspace/.local/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      resources:
        requests:
          cpu: "4"
          memory: "6Gi"
        limits:
          cpu: "4"
          memory: "6Gi"
      volumeMounts:
        - name: storage
          mountPath: /workspace
  volumes:
    - name: storage
      hostPath:
        path: /home/dgx-s-bmu-cse-230480/final/FinalTry
        type: Directory
